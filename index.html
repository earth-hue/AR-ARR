<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>AR.js Fast Load</title>
    <style>
        /* สร้างหน้าจอ Loading ให้เห็นทันที */
        #loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #222; color: white; display: flex; 
            flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999; font-family: sans-serif;
        }
        .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; animation: spin 2s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body style="margin: 0; overflow: hidden;">

    <div id="loading-overlay">
        <div class="spinner"></div>
        <p id="status-text">กำลังเริ่มต้นระบบ...</p>
        <p style="font-size: 10px; color: #888;">(หากจอนี้นิ่งนานเกิน 1 นาที ให้ตรวจสอบอินเทอร์เน็ต)</p>
    </div>

    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false">
        <a-camera gps-camera="simulateLatitude: 15.3625; simulateLongitude: 100.0143;" rotation-reader></a-camera>
        <a-box position="0 1.6 -5" color="red"></a-box>
    </a-scene>

    <script>
        window.addEventListener('load', () => {
            const status = document.getElementById('status-text');
            status.innerText = "โหลด Library สำเร็จ! กำลังเข้าถึงกล้อง...";
            
            // ปิดหน้าจอ Loading เมื่อทุกอย่างพร้อม
            setTimeout(() => {
                document.getElementById('loading-overlay').style.display = 'none';
            }, 2000);
        });
    </script>
</body>
</html>
